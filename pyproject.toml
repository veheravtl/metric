[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aerial-map-measurement"
version = "0.1.0"
description = "Учебный проект визуальной привязки аэрофотоснимков и измерения местности"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "gradio>=6.29,<7",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<6",
    "pyproj>=3.7,<4",
    "rasterio>=1.4,<2",
    "shapely>=2.1,<3",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
